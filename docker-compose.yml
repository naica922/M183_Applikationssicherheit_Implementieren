version: "3.8"

services:
  db:
    image: postgres:16
    container_name: securepass-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securepass
      POSTGRES_USER: securepass
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
